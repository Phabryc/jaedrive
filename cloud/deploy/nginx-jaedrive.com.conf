# Example server block for the existing host nginx (outside the Docker Compose stack) —
# see cloud/DESIGN.md §13. Adjust paths to match your certbot setup, drop this into
# /etc/nginx/sites-available/jaedrive.com and symlink into sites-enabled, or merge into
# whatever config-management pattern the VPS's other sites already use.

server {
    listen 80;
    server_name jaedrive.com www.jaedrive.com;

    # certbot's HTTP-01 challenge needs plain HTTP to work before TLS exists; certbot
    # --nginx will rewrite this block to redirect to https automatically once run.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name jaedrive.com www.jaedrive.com;

    # ssl_certificate / ssl_certificate_key: filled in automatically by
    # `certbot --nginx -d jaedrive.com -d www.jaedrive.com`, see the deploy runbook.

    # GPX trip uploads from the car app can be a few tens of KB; default 1m is plenty, but
    # raised for headroom - see DESIGN.md §13.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
