version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jaedrive
      POSTGRES_USER: jaedrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jaedrive_pgdata:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jaedrive:${POSTGRES_PASSWORD}@postgres:5432/jaedrive
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      NODE_ENV: production
    ports:
      # Optional/for direct debugging only (e.g. curl from the VPS itself) - Nginx Proxy
      # Manager reaches this container over the shared npm_default network below, by
      # service name, not through this published port.
      - "127.0.0.1:4300:3000"
    depends_on:
      - postgres
    networks:
      - internal
      - npm_default

volumes:
  jaedrive_pgdata:

networks:
  internal:
  # Reuses the Docker network Nginx Proxy Manager's own stack already created, so NPM's
  # container can reach this one directly by service name ("api") without going through
  # the host at all. Must already exist (it does - it's NPM's own compose-created network).
  npm_default:
    external: true
