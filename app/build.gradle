apply plugin: 'com.android.application'

android {
    compileSdk 33
    namespace 'com.phabryc.jaedrive'

    defaultConfig {
        applicationId "com.phabryc.jaedrive"
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "0.1-probe"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }

    // Build "release" offuscata/firmata (2026-08-07, richiesta esplicita utente: pronta da
    // distribuire quando serve) - prima non esisteva questo blocco: AGP crea comunque un
    // build type "release" di default anche senza dichiararlo, ma SENZA offuscamento
    // (minifyEnabled false di default) e senza signingConfig esplicita (stesso identico
    // problema gia' risolto nel modulo probe/: INSTALL_PARSE_FAILED_NO_CERTIFICATES).
    // Nessun keystore di produzione: l'APK si installa via USB, non passa da nessuno store,
    // quindi la firma debug basta - stesso ragionamento e stesso pattern gia' verificato in
    // probe/build.gradle.
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // Nome file ufficiale dell'APK invece del generico "app-debug.apk" (piu' comodo
    // da riconoscere una volta copiato su chiavetta USB per l'installazione).
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "JaeDrive.apk"
        }
    }
}

dependencies {
    // android.car è una system library - non è su Maven
    // va messa come provided/compileOnly dal SDK dell'head unit
    compileOnly fileTree(dir: 'libs', include: ['android.car.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Mappa OpenStreetMap reale per il dettaglio viaggio in Storico (tile scaricati
    // dai server OSM se l'head unit ha connessione internet).
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // Upload dei trip al backend cloud in background, con retry/backoff automatico e
    // sopravvivenza a riavvii/kill del processo (stesso motivo per cui gia' usiamo
    // stopWithTask=false + AccessibilityService per TrackingService) - vedi SyncWorker.
    // Fermo a 2.8.1 (non l'ultima) perche' 2.9.0+ richiede compileSdk 34 - questo progetto
    // resta volutamente su compileSdk 33 per compatibilita' con l'head unit del veicolo.
    implementation 'androidx.work:work-runtime:2.8.1'
    // Solo l'encoder QR (nessuna dipendenza da fotocamera/scanner) per mostrare il codice
    // di pairing anche come QR nel dialogo di associazione - vedi QrCodeUtil.
    implementation 'com.google.zxing:core:3.5.3'
}
